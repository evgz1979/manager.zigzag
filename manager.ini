[storage]
; Корень: папки клиентов, внутри — заказы с любой вложенностью.
; Папки с # в корне отображаются отдельными кнопками.
; Можно указать абсолютный путь, путь с ~ или путь относительно этого INI.
; Здесь только тестовые документы. Рабочие настройки хранятся на M4.
root = data/dev-documents

[server]
host = 127.0.0.1
port = 8766
